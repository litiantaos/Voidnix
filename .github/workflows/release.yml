name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: bun install

      - name: 扩展同步产物校验
        run: bun run check:extensions

      - name: 命令名双向差集校验
        run: bun run check:commands

      - name: agent 安全底线一致校验
        run: bun run check:agent-bounds

      - name: window-manager 尺寸边界一致校验
        run: bun run check:wm-bounds

      - name: 代码风格检查
        run: bun run lint:check

      - name: 类型检查
        run: bun run typecheck

      - name: 前端单元测试
        run: bun run test

      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: 构建并打包（zsh binary 经 bundle.resources 自动嵌入）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Voidnix ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
