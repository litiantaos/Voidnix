name: CI

on:
  push:
    branches: [main, refactor/v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: 安装 Rust 工具链（含 rustfmt + clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: bun install

      # ── 代码风格（前端 + Rust）──
      - name: 前端代码风格检查（Prettier + ESLint）
        run: bun run lint:check

      - name: Rust 代码风格检查（rustfmt）
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path extensions/zsh-autosuggestions/native/Cargo.toml --check

      # ── 类型 + 静态分析 ──
      - name: 类型检查（vue-tsc 严格模式）
        run: bun run typecheck

      - name: Rust clippy（-D warnings）
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
          cargo clippy --manifest-path extensions/zsh-autosuggestions/native/Cargo.toml -- -D warnings

      # ── 漂移校验 ──
      - name: 扩展同步产物校验（extensions.rs + windowViews 漂移）
        run: bun run check:extensions

      - name: 命令名双向差集 + 裸 invoke 检测
        run: bun run check:commands

      - name: agent 安全底线 Rust↔TS 一致校验
        run: bun run check:agent-bounds

      - name: window-manager 尺寸边界 Rust↔TS 一致校验
        run: bun run check:wm-bounds

      - name: 扩展 meta.order 唯一校验
        run: bun run check:extension-orders

      # ── 单元测试 ──
      - name: 前端单元测试（Vitest）
        run: bun run test

      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # ── E2E（Playwright，纯 web 场景对 Vite dev server）──
      - name: 安装 Playwright 浏览器
        run: bunx playwright install --with-deps chromium

      - name: E2E 测试（Playwright）
        run: bun run test:e2e
