<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --accent: #3d82f0;
        --cool: 100 120 160;
        --ink: rgba(30, 35, 50, 0.92);
        --sec: rgba(80, 90, 115, 0.82);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #f8f8f9;
        font-family: ui-monospace, 'PingFang SC', 'SF Pro Display', sans-serif;
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 64px 84px;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      /* Mica 雾团 */
      .fog {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .fog span {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
      }
      .fog .a {
        width: 760px;
        height: 500px;
        left: -180px;
        top: -210px;
        background: rgb(215 230 255 / 0.6);
      }
      .fog .b {
        width: 680px;
        height: 460px;
        right: -180px;
        bottom: -230px;
        background: rgb(205 218 245 / 0.48);
      }

      /* 三维键盘图纸（首启引导同款，og-keyboard.svg 由 gen-og-keyboard.mjs 生成）：
           大幅右置（宽 950，约为初版右置小图的 1.5 倍），墨迹右缘贴画布右缘，
           从左到右透明渐变（mask）使其在文字列下方淡出、右侧全显 */
      .iso {
        position: absolute;
        top: 50%;
        /* 宽度与右偏按 viewBox 墨迹域（x 10~674）换算；+16px 按墨迹域垂直居中 */
        right: -61px;
        width: 950px;
        transform: translateY(calc(-50% + 16px));
        /* 起点 10% 起步（不降至全透，左侧保留浅水印）→ 右侧全显 */
        -webkit-mask-image: linear-gradient(to right, rgba(0, 0, 0, 0.1) 15%, black 85%);
        mask-image: linear-gradient(to right, rgba(0, 0, 0, 0.1) 15%, black 85%);
        z-index: 0;
        pointer-events: none;
      }

      /* 文字列三层垂直两端对齐：品牌（顶部）/ 大字（居中）/ 小字（钉底） */
      .stage {
        position: relative;
        z-index: 1;
        flex: 1 1 0%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* ── 品牌 ── */
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .mark {
        width: 44px;
        height: 44px;
        filter: drop-shadow(0 4px 12px rgb(var(--cool) / 0.22));
      }
      .brand-name {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
      }

      /* ── 标题：主体（space-between 居中位，间距由分布承担）── */
      .title {
        font-family: ui-monospace, 'PingFang SC', sans-serif;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.24;
      }
      .title em {
        font-style: normal;
        color: var(--accent);
      }

      /* ── 标题下一行：定位 + 功能（两行纵排：desc / feats，space-between 钉底）── */
      .info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        font-size: 16px;
        font-family: 'PingFang SC', sans-serif;
        letter-spacing: 0.02em;
      }
      .info .desc {
        color: var(--accent);
        white-space: nowrap;
      }
      .info .feats {
        color: var(--sec);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="fog"><span class="a"></span><span class="b"></span></div>
    <img class="iso" src="og-keyboard.svg" alt="" />

    <div class="stage">
      <div class="brand">
        <img class="mark" src="../public/app-icon.png" alt="Voidnix" />
        <span class="brand-name">Voidnix</span>
      </div>

      <h1 class="title">想到就到，<em>触手可及</em></h1>

      <div class="info">
        <span class="desc">macOS 效率启动器</span>
        <span class="feats">剪贴板 · 截屏 · 翻译 · AI 助手 · 窗口管理 等</span>
      </div>
    </div>
  </body>
</html>
