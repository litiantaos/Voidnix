[extension]
id = "uuid"
name = "UUID 生成"
version = "1.0.0"
description = "生成 UUID v4 和 NanoID"
author = "Voidnix"
icon = "i-ri-key-line"
keywords = ["uuid", "guid", "生成", "generate"]
voidnix_api = "^1"

[entry]
main = "index.js"

[ui]
preferred_view = "list"
search_placeholder = "输入数字批量生成，例如: 10"

[capabilities]
required = ["clipboard.write"]
