[package]
name = "Voidnix"
version = "0.1.23"
description = "A Voidnix launcher for macOS"
authors = ["litiantao"]
edition = "2021"
default-run = "Voidnix"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "net", "io-util"] }
tokio-util = "0.7"
base64 = "0.23"
log = "0.4"
dirs = "7"
regex = "1"
reqwest = { version = "0.13", features = ["json", "rustls", "stream", "form"] }
futures-util = "0.3"
async-trait = "0.1"
sha2 = "0.11"
urlencoding = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "component"] }
tokio-tungstenite = "0.30"


[dev-dependencies]
# mock runtime（tauri::test）：llm/client.rs 流式解析回归测试注入 AppHandle 用
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["elcapitan"] }
core-foundation = "0.10"
libc = "0.2"
notify = "8.2.0"
rlimit = "0.11"
plist = "1"
block2 = "0.6"
objc2 = { version = "0.6.4", features = ["exception"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL", "NSGeometry", "NSData", "NSDictionary", "NSArray", "NSEnumerator", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSWindow", "NSEvent", "NSScreen", "NSImage", "NSGraphicsContext", "NSBitmapImageRep", "NSImageRep", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSAnimationContext", "NSVisualEffectView", "NSColor", "NSAppearance", "NSView", "NSTextField", "NSImageView", "NSFont", "NSCell", "NSImageCell", "NSCursor", "NSDragging", "NSPanel"] }
objc2-quartz-core = { version = "0.3", features = ["CAMediaTimingFunction", "CALayer", "CATransaction", "CATransform3D", "objc2-core-foundation"] }
objc2-vision = { version = "0.3.2", features = ["VNRecognizeTextRequest", "VNDetectBarcodesRequest", "VNRequestHandler", "VNRequest", "VNTypes", "VNObservation", "objc2-core-graphics", "objc2-image-io"] }
# CGImage ZST 封装（OCR 喂 Vision 用；截图链路的 core-graphics 0.25 是另一 crate，经裸指针互通）
objc2-core-graphics = "0.3.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
