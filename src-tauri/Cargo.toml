[package]
name = "Voidnix"
version = "0.1.0"
description = "A Voidnix launcher for macOS"
authors = ["litiantao"]
edition = "2021"
default-run = "Voidnix"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
tokio-util = "0.7"
base64 = "0.22"
log = "0.4"
dirs = "6"
regex = "1"
reqwest = { version = "0.13.3", features = ["json", "rustls", "stream", "form"] }
futures-util = "0.3"
async-trait = "0.1"
sha2 = "0.11"
urlencoding = "2"


[dev-dependencies]


[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["elcapitan"] }
core-foundation = "0.10"
libc = "0.2"
notify = "8.2.0"
rlimit = "0.10"
plist = "1"
block2 = "0.6"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSGeometry", "NSData", "NSDictionary", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSWindow", "NSEvent", "NSScreen", "NSImage", "NSGraphicsContext", "NSBitmapImageRep", "NSImageRep", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
