[package]
name = "Voidnix"
version = "0.1.0"
description = "A Voidnix launcher for macOS"
authors = ["litiantao"]
edition = "2021"
default-run = "Voidnix"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zsh-autosuggestions"
path = "../extensions/zsh-autosuggestions/native/daemon/src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
base64 = "0.22"
pinyin = "0.11"
log = "0.4"
dirs = "6"
nucleo-matcher = "0.3.1"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.13.3", features = ["json", "rustls", "stream", "form"] }
plist = "1"
block2 = "0.6"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSGeometry", "NSData", "NSDictionary", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSWindow", "NSEvent", "NSScreen", "NSImage", "NSGraphicsContext", "NSBitmapImageRep", "NSImageRep", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication"] }


# specta 可选依赖（仅 specta feature 启用时编译，生产构建零开销）
specta            = { version = "2.0.0-rc.25", optional = true }
specta-typescript = { version = "0.0.12", optional = true }
tauri-specta      = { version = "2.0.0-rc.25", features = ["derive", "typescript"], optional = true }

[features]
# webkit_tuning 测试用 mock 桥接，仅 dev/test 启用

# 仅用于开发时生成 TypeScript bindings，生产构建不启用
specta = ["dep:specta", "dep:specta-typescript", "dep:tauri-specta"]

[dev-dependencies]
proptest = "1"


[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["elcapitan"] }
core-foundation = "0.10"
libc = "0.2"
notify = "8.2.0"
urlencoding = "2"

sha2 = "0.10"
futures-util = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
