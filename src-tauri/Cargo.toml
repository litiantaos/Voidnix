[package]
name = "Voidnix"
version = "0.1.0"
description = "A Voidnix launcher for macOS"
authors = ["litiantao"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
base64 = "0.22"
pinyin = "0.11"
log = "0.4"
env_logger = "0.11"
dirs = "6"
nucleo-matcher = "0.3.1"
once_cell = "1.21.4"
reqwest = { version = "0.13.3", features = ["json", "rustls", "stream", "form"] }
plist = "1"
block2 = "0.6"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSGeometry", "NSData", "NSDictionary", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSWindow", "NSImage", "NSGraphicsContext", "NSBitmapImageRep", "NSImageRep", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["elcapitan"] }
libc = "0.2"
notify = "8.2.0"
urlencoding = "2"
url = "2"
sha2 = "0.10"
futures-util = "0.3"
rayon = "1.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
